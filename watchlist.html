<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WatchList 📺</title>
    <style>
        body{
            background-image: url('https://i.pinimg.com/1200x/2e/0f/b0/2e0fb04b84529707a48ba49f81b76a13.jpg');
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .list-container {
            background: rgba(0,0,0,0.7);
            margin: 50px auto;
            padding: 20px;
            width: 80%;
            border-radius: 15px;
        }
        .list-item {
            background: rgba(255,255,255,0.1);
            margin: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
        }
        button { background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>My WatchList 📺</h1>
    <a href="hakona_matata.html" style="color: yellow;">Back Home</a>

    <div class="list-container" id="watchlist-display">
        <!-- Will be populated by JS -->
    </div>

    <script>
        function loadWatchlist() {
            const wl = JSON.parse(localStorage.getItem('watchlist')) || [];
            const display = document.getElementById('watchlist-display');
            display.innerHTML = wl.length ? "" : "<p>Your watchlist is empty!</p>";
            wl.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span>${item}</span> <button onclick="removeItem('${item}')">Remove</button>`;
                display.appendChild(div);
            });
        }

        function removeItem(item) {
            let wl = JSON.parse(localStorage.getItem('watchlist')) || [];
            wl = wl.filter(i => i !== item);
            localStorage.setItem('watchlist', JSON.stringify(wl));
            loadWatchlist();
        }

        window.onload = loadWatchlist;
    </script>
</body>
</html>
