<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites ❤️</title>
    <link rel="preconnect" href="https://i.pinimg.com">
    <link rel="dns-prefetch" href="https://i.pinimg.com">
    <link rel="preload" as="image" href="https://i.pinimg.com/1200x/2e/0f/b0/2e0fb04b84529707a48ba49f81b76a13.jpg">
    <style>
        body{
            background-image: url('https://i.pinimg.com/1200x/2e/0f/b0/2e0fb04b84529707a48ba49f81b76a13.jpg');
            background-size: cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .list-container {
            background: rgba(139, 0, 0, 0.7);
            margin: 50px auto;
            padding: 20px;
            width: 80%;
            border-radius: 15px;
        }
        .list-item {
            background: rgba(255,255,255,0.1);
            margin: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
        }
        button { background: white; color: red; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>My Favorites ❤️</h1>
    <a href="hakona_matata.html" style="color: yellow;">Back Home</a>

    <div class="list-container" id="favorites-display">
        <!-- Will be populated by JS -->
    </div>

    <script>
        function loadFavorites() {
            const favs = JSON.parse(localStorage.getItem('favorites')) || [];
            const display = document.getElementById('favorites-display');

            if (!favs.length) {
                display.innerHTML = "<p>No favorites yet!</p>";
                return;
            }

            // Performance optimization: Use DocumentFragment and textContent to minimize layout thrashing and prevent XSS
            display.textContent = "";
            const fragment = document.createDocumentFragment();

            favs.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';

                const span = document.createElement('span');
                span.textContent = item;

                const button = document.createElement('button');
                button.textContent = "Remove";
                button.onclick = () => removeItem(item);

                div.appendChild(span);
                div.appendChild(button);
                fragment.appendChild(div);
            });
            display.appendChild(fragment);
        }

        function removeItem(item) {
            let favs = JSON.parse(localStorage.getItem('favorites')) || [];
            favs = favs.filter(i => i !== item);
            localStorage.setItem('favorites', JSON.stringify(favs));
            loadFavorites();
        }

        // Optimization: Use DOMContentLoaded instead of window.onload to show content faster
        window.addEventListener('DOMContentLoaded', loadFavorites);
    </script>
</body>
</html>
